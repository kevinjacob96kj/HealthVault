<header class="site-header">
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" routerLink="/" aria-label="HealthVault home">
      <span class="brand-mark" aria-hidden="true">+</span>
      <span>HealthVault</span>
    </a>

    <div class="nav-links">
      @if (auth.isLoggedIn && !auth.mustChangePassword) {
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Home
        </a>
      }
      @if (auth.isAdmin && !auth.mustChangePassword) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }

      @if (auth.isLoggedIn) {
        <div class="user-menu">
          <button type="button" class="user-chip" aria-haspopup="true">
            {{ auth.displayName }}
          </button>
          <div class="user-menu-panel" role="menu">
            @if (!auth.mustChangePassword) {
              <a routerLink="/profile" role="menuitem">View profile</a>
            }
            <button type="button" role="menuitem" (click)="auth.logout()">
              Sign out
            </button>
          </div>
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Sign in</a>
      }
    </div>
  </nav>
</header>

<main>
  <router-outlet />
</main>
