<section class="login-page">
  <form class="login-card" (ngSubmit)="submit()">
    <h1>Sign in</h1>
    <p>Use your HealthVault email and password.</p>

    <label>
      Email
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        autocomplete="username"
        required
      />
    </label>

    <label>
      Password
      <app-password-field
        [(ngModel)]="password"
        name="password"
        autocomplete="current-password"
        [required]="true"
      />
    </label>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="hint">New users start with password: Password&#64;1</p>
  </form>
</section>
